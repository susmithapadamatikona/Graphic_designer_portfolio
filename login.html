<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Stackly — distinctive visual identities, thoughtful packaging and digital experiences."
    />
    <title>Login — Stackly</title>
    <link rel="icon" href="assets/images/stackly-whitish_blue-logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
    <link rel="stylesheet" href="assets/css/page-sections.css" />
    <link rel="stylesheet" href="assets/css/page-heroes.css" />
    <link rel="stylesheet" href="assets/css/auth-pages.css" />
    <link rel="stylesheet" href="assets/css/mobile.css" />
    <script type="module" src="assets/js/main.js"></script>
  </head>
  <body data-page="login">
    <a class="skip" href="#main">Skip to content</a>
    <div id="app" data-static-page="true">
<main id="main">
        <div class="auth-box">
          <div class="auth-navigation">
            <a class="logo" href="index.html" aria-label="Stackly home">
              <img src="assets/images/stackly-whitish_blue-logo.webp" alt="Stackly" width="160" height="61" />
            </a>
            <a class="button secondary auth-home" href="index.html"><span aria-hidden="true">&larr;</span> Back to Home</a>
          </div>
          <div class="eyebrow">STACKLY / DEMO ACCESS</div>
          <h2>Back to the studio.</h2>
          <p>
            Frontend demo only. This does not provide secure authentication. Do not use a real
            password.
          </p>
          <form id="auth-form">
            <label class="field">Select Role
              <select name="role" required>
                <option value="">Select your role</option>
                <option value="client">Client</option>
                <option value="designer">Designer</option>
                <option value="admin">Admin</option>
              </select>
            </label>

            <label class="field">Email<input name="email" type="email" placeholder="you@example.com" autocomplete="email" required="" /></label
            ><label class="field"
              >Demo password<input
                name="password"
                placeholder="At least 6 characters"
                type="password"
                required=""
                minlength="6"
                autocomplete="off" /></label
            ><button class="button">Enter Demo Dashboard ↗</button>
          </form>
          <nav class="auth-social" aria-label="Social media"><a href="404.html" aria-label="Instagram (opens in a new tab)" title="Instagram"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="18" cy="6" r="1"/></svg></a><a href="404.html" aria-label="YouTube (opens in a new tab)" title="YouTube"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" fill="#ff0000"/><path d="M10 9v6l6-3z" fill="#fff"/></svg></a><a href="404.html" aria-label="LinkedIn (opens in a new tab)" title="LinkedIn"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 10v7M11 17v-7m0 3c0-4 6-4 6 0v4"/><circle cx="7" cy="7" r="1"/></svg></a></nav>
          <p class="auth-links">
            <a href="register.html">Create a demo profile</a> ·
            <a href="404.html">Forgot Password?</a>
          </p>
          <p class="auth-note">
            No real credentials are required. The login form opens a local demonstration session.
          </p>
        </div>
      </main>
</div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal"></dialog>
    <button class="back-top" aria-label="Back to top">↑</button>
  </body>
</html>
